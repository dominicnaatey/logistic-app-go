version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: logistic_postgres
    environment:
      POSTGRES_USER: logistic_user
      POSTGRES_PASSWORD: logistic_pass
      POSTGRES_DB: logistic_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistic_user -d logistic_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logistic_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
